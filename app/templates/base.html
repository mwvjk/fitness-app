<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Fitness App{% endblock %}</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: sans-serif; width: calc(100% - 32px); max-width: 1100px; margin: 0 auto; padding: 20px 0; background: #fafafa; color: #222; }
  h1 { font-size: 1.3em; }
  nav { display: flex; gap: 12px; margin-bottom: 16px; }
  nav a { text-decoration: none; color: #333; padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px; }
  nav a.active { background: #333; color: #fff; }
  form { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; background: #fff; padding: 12px; border-radius: 8px; border: 1px solid #ddd; }
  .entry-form { max-width: 560px; }
  label { font-size: 0.85em; color: #555; }
  input, textarea { padding: 8px; font-size: 1em; border: 1px solid #ccc; border-radius: 6px; }
  button { padding: 10px; font-size: 1em; background: #333; color: #fff; border: none; border-radius: 6px; }
  .water-controls { display: flex; align-items: stretch; gap: 8px; margin-bottom: 20px; }
  .water-intake { max-width: 560px; }
  .water-controls form { margin: 0; }
  .water-quick { flex: 0 0 auto; justify-content: center; }
  .water-custom { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
  .water-custom label { grid-column: 1 / -1; }
  .water-total { margin: 8px 0; }
  summary { cursor: pointer; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
  .workout-table { max-width: 560px; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid #eee; }
  .del { color: #b00; background: none; border: none; padding: 2px 6px; font-size: 0.9em; }
  .total { font-weight: bold; margin-bottom: 8px; }
  @media (max-width: 600px) {
    body { width: calc(100% - 24px); padding: 12px 0; }
    .entry-form { max-width: none; }
  }
</style>
</head>
<body>
  <h1>Fitness App</h1>
  <nav>
    <a href="/workouts" class="{{ 'active' if active == 'workouts' }}">Workouts</a>
    <a href="/meals" class="{{ 'active' if active == 'meals' }}">Meals</a>
  </nav>
  {% block content %}{% endblock %}
  <script>
    const now = new Date();
    const localToday = [
      now.getFullYear(),
      String(now.getMonth() + 1).padStart(2, "0"),
      String(now.getDate()).padStart(2, "0"),
    ].join("-");
    document.querySelectorAll("input[data-user-today]").forEach((input) => {
      input.value = localToday;
    });
  </script>
</body>
</html>
