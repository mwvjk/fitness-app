{% extends "base.html" %}
{% block content %}
<form method="post" action="/workouts">
  {% if error %}<p role="alert">{{ error }}</p>{% endif %}

  <label>Date</label>
  <input type="date" name="log_date" value="{{ today }}" data-user-today required>

  <label>Exercise</label>
  <input type="text" name="exercise" placeholder="e.g. Bench press" value="{{ form.exercise|default('') }}" required>

  <label>Sets</label>
  <input type="number" name="sets" min="0" value="{{ form.sets|default('') }}" required>

  <label>Reps</label>
  <input type="number" name="reps" min="0" value="{{ form.reps|default('') }}" required>

  <label>Weight (kg)</label>
  <input type="number" step="0.5" name="weight_kg" min="0" value="{{ form.weight_kg|default('') }}" required>

  <label>Notes (optional)</label>
  <textarea name="notes" rows="2">{{ form.notes|default('') }}</textarea>

  <button type="submit">Add workout</button>
</form>

<table>
  <tr><th>Date</th><th>Exercise</th><th>Sets</th><th>Reps</th><th>kg</th><th></th></tr>
  {% for e in entries %}
  <tr>
    <td>{{ e.log_date }}</td>
    <td>{{ e.exercise }}</td>
    <td>{{ e.sets or "" }}</td>
    <td>{{ e.reps or "" }}</td>
    <td>{{ e.weight_kg or "" }}</td>
    <td>
      <form method="post" action="/workouts/{{ e.id }}/delete" style="display:inline; padding:0; border:none; background:none;">
        <button type="submit" class="del">✕</button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
