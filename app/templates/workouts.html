{% extends "base.html" %}
{% block content %}
<form method="post" action="/workouts">
  <label>Date</label>
  <input type="date" name="log_date" value="{{ today }}" required>

  <label>Exercise</label>
  <input type="text" name="exercise" placeholder="e.g. Bench press" required>

  <details>
    <summary>More details</summary>

    <div class="optional-fields">
      <label>Sets</label>
      <input type="number" name="sets" min="0">

      <label>Reps</label>
      <input type="number" name="reps" min="0">

      <label>Weight (kg)</label>
      <input type="number" step="0.5" name="weight_kg" min="0">

      <label>Notes</label>
      <textarea name="notes" rows="2"></textarea>
    </div>
  </details>

  <button type="submit">Add workout</button>
</form>

<table>
  <tr><th>Date</th><th>Exercise</th><th>Sets</th><th>Reps</th><th>kg</th><th></th></tr>
  {% for e in entries %}
  <tr>
    <td>{{ e.log_date }}</td>
    <td>{{ e.exercise }}</td>
    <td>{{ e.sets or "" }}</td>
    <td>{{ e.reps or "" }}</td>
    <td>{{ e.weight_kg or "" }}</td>
    <td>
      <form method="post" action="/workouts/{{ e.id }}/delete" style="display:inline; padding:0; border:none; background:none;">
        <button type="submit" class="del">✕</button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
