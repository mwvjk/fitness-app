version: "3.8"
services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .devcontainer/.env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .devcontainer/.env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .devcontainer/.env}"
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .devcontainer/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .devcontainer/.env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .devcontainer/.env}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  db-data:
