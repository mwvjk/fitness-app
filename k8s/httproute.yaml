# Requires the Gateway API CRDs + a Gateway already set up in your cluster.
# Adjust parentRefs to match your existing Gateway name/namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fitness-app
  namespace: fitness-app
spec:
  parentRefs:
    - name: <YOUR_GATEWAY_NAME>
      namespace: <YOUR_GATEWAY_NAMESPACE>
  hostnames:
    - "fitness-app.home.lan"   # change to whatever hostname you'll use
  rules:
    - backendRefs:
        - name: fitness-app
          port: 80
